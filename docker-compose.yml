services:
  db:
    image: postgres:15-alpine
    container_name: coupage_postgres
    restart: always
    env_file:
      - catalog-api/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-coupage_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
