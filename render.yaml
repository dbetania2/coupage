services:
  # 1. Backend Django 
  - type: web
    name: catalog-api
    runtime: docker
    dockerfilePath: ./catalog-api/Dockerfile
    dockerContext: ./catalog-api
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        fromDatabase:
          name: coupage-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: coupage-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: coupage-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: coupage-db
          property: password
      - key: DB_PORT
        fromDatabase:
          name: coupage-db
          property: port

  # 2. Frontend Web
  - type: web
    name: frontend-web
    runtime: node
    rootDir: ./web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_CATALOG_API_URL
        value: https://coupage.onrender.com/api 

databases:
  - name: coupage-db
    databaseName: coupage_db
    user: postgres